[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gads-ai-bridge"
version = "1.0.0"
description = "Universal Google Ads CLI bridge for AI coding assistants (Claude Code, Cursor, Cline, Copilot)"
readme = "README.md"
authors = [{ name = "Anton Lisitskyi" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "google-auth-oauthlib>=1.0.0",
    "requests>=2.28.0"
]

[project.scripts]
gads = "gads_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
